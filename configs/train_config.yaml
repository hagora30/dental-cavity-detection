model:
  architecture: yolov8m
  pretrained: true
  imgsz: 1280

training:
  epochs: 200
  batch: 8
  workers: 8
  patience: 50
  optimizer: AdamW
  lr0: 0.0005
  lrf: 0.01
  warmup_epochs: 5
  weight_decay: 0.0005
  momentum: 0.937
  dropout: 0.1
  close_mosaic: 20

loss:
  cls_pw: 1.0
  fl_gamma: 2.0

augmentation:
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.3
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.15
  copy_paste: 0.0

logging:
  project: dental-cavity-detection
  run_name: yolov8m-run2-imgsz1280
  save_dir: runs/
  wandb: true

data:
  config: configs/dataset.yaml
